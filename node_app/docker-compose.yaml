services:
  app:
    build:
      context: .
    image: app:v2
    ports:
      - 8080:8080
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - MONGODB_URL=${MONGODB_URL}
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - 27017:27017
    container_name: mongo_container2


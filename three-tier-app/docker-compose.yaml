version: '1.0'

services:
  mongo:
    image: mongo:latest
    container_name: mongo_container3
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}   
      MONGO_INITDB_DATABASE: three_tier_db  
    volumes:
      - mongo-data:/data/db
      - ./mongo-data/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    networks:
      - backend-network

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express_container
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo
    networks:
      - backend-network

  backend:
    build:
      context: ./backend
    image: backend:v1
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - frontend-network
      - backend-network

  frontend:
    build:
      context: ./frontend
    image: frontend:v1
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - frontend-network

volumes:
  mongo-data:

networks:
  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge